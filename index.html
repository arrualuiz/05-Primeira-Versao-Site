<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Pessoal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="dashboard">
    <header>
      <h1 id="clock">00:00</h1>
      <p id="date">Domingo, 19 de Outubro</p>
    </header>

    <main>
      <section id="weather">
        <h2>Clima</h2>
        <div id="weather-info">Carregando...</div>
      </section>

      <section id="news">
        <h2>Notícias do seu time</h2>
        <ul id="news-list"></ul>
      </section>
    </main>

    <footer>
      <h2>Calendário</h2>
      <div id="calendar"></div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
